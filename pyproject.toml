# ============================================================================
# Package definition for the ANPR prototype.
#
# WHY THIS FILE EXISTS
# The project brief (§9) requires a repo that runs "from a clean clone".
# This file is what makes that true: after `pip install -e .` any notebook,
# script or test can do `from anpr.data import load_emnist` regardless of the
# directory it is run from. Without it we would be back to sys.path hacks and
# hard-coded /content paths, which is exactly what broke the Colab notebook.
#
# The "-e" (editable) install means changes to src/ take effect immediately,
# with no reinstall. That is what you want while five people are editing.
# ============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anpr"
version = "0.1.0"
description = "Automated Number Plate Recognition prototype - EMNIST character classifier + segmentation pipeline"
readme = "README.md"
requires-python = ">=3.10"

# Runtime dependencies. Deliberately kept to the libraries the brief permits
# (§6: NumPy, pandas, TensorFlow, scikit-learn, OpenCV, PIL, Streamlit).
# NOTE: no OCR engine appears here, and none may be added as our classifier -
# Tesseract/EasyOCR/PaddleOCR as the classifier is an automatic -20 (§6).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "opencv-python>=4.8",       # thresholding + connected components (segmentation)
    "pillow>=10.0",             # font rendering for synthetic plates
    "scikit-learn>=1.3",        # stratified splits, confusion matrix
    "tensorflow>=2.15",         # the classifier. Keras 3 API
    "pyyaml>=6.0",              # config/default.yaml
]

[project.optional-dependencies]
# The EMNIST torchvision download route. Optional because the local-CSV route
# works without it - but it is the route that actually succeeded for us when
# the Kaggle CSV turned out to be truncated, so most people will want it.
download = ["torch>=2.0", "torchvision>=0.15"]

# The demo interface (ML-47). Kept optional so `pip install -e .` stays light
# for teammates who are only training models.
demo = ["streamlit>=1.30"]

# Test harness. `pytest` from the repo root runs everything in tests/.
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q keeps output readable; the guard tests print a lot on failure by design.
addopts = "-q"
